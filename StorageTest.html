<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Run Storage5.0 Test Script</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f8f9fa;
        }
        .console-output {
            background-color: #212529;
            color: #f8f9fa;
            font-family: monospace;
            padding: 1rem;
            border-radius: 0.375rem;
            height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .btn-run {
            min-width: 150px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-database"></i> Storage5.0 Test Runner</a>
        </div>
    </nav>

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10 col-sm-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="fas fa-play-circle"></i> Run test1.py on storage5.0.py</h5>
                    </div>
                    <div class="card-body">
                        <p class="mb-3">Click the button below to run the test script <code>test1.py</code> located at <code>J:\storage5.0\storage5.0\test1.py</code> which tests the <code>storage5.0.py</code> module.</p>
                        <button id="runTestBtn" class="btn btn-success btn-run mb-3">
                            <i class="fas fa-play"></i> Run Test
                        </button>
                        <div id="consoleOutput" class="console-output" tabindex="0" aria-live="polite" aria-label="Console output window">
                            Ready to run test...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center text-muted py-3 mt-5">
        &copy; 2024 Storage5.0 Test Runner
    </footer>

    <script>
        const runTestBtn = document.getElementById('runTestBtn');
        const consoleOutput = document.getElementById('consoleOutput');

        runTestBtn.addEventListener('click', async () => {
            runTestBtn.disabled = true;
            consoleOutput.textContent = 'Running test script... Please wait.\n';
            
            try {
                // Since the user didn't specify backend environment or API, 
                // here we simulate running the script by calling a backend endpoint.
                // This front-end code assumes you have a backend API at /run-test 
                // that will run the test1.py script and return the output as text.
                // Adjust accordingly in your backend.

                const response = await fetch('/run-test', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        testScriptPath: 'J:\\storage5.0\\storage5.0\\test1.py',
                        storageScriptPath: 'J:\\storage5.0\\storage5.0\\storage5.0.py'
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status} ${response.statusText}`);
                }

                const data = await response.text();
                consoleOutput.textContent = data;
                consoleOutput.scrollTop = consoleOutput.scrollHeight;
            } catch (error) {
                consoleOutput.textContent += `\nError running test: ${error.message}`;
            } finally {
                runTestBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
